buildscript {
    repositories {
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
    }
    dependencies {
        // ✅ Nâng lên phiên bản có trên kho, tương thích dự án cũ
        classpath 'com.android.tools.build:gradle:3.0.1'
        classpath 'org.androidannotations:androidannotations:4.6.0'
    }
}

allprojects {
    repositories {
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
