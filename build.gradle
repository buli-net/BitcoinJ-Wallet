buildscript {
    repositories {
        google()
        mavenCentral()
        // ==== XÓA jcenter() ĐÃ CHẾT ====
    }
    dependencies {
        // ==== NÂNG CẤP LÊN PHIÊN BẢN TƯƠNG THÍCH: 3.6.4 ====
        classpath 'com.android.tools.build:gradle:3.6.4'
        classpath 'me.tatarka:gradle-retrolambda:3.7.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // ==== XÓA jcenter() ĐÃ CHẾT ====
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
