buildscript {
    repositories {
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
    }
    dependencies {
        // ✅ Thay 2.3.3 → 2.3.4 (phiên bản cuối dòng 2.3.x, có trên kho)
        classpath 'com.android.tools.build:gradle:2.3.4'
        classpath 'org.androidannotations:androidannotations:4.6.0'
    }
}

allprojects {
    repositories {
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
