buildscript {
    repositories {
        // ❌ Xóa google() → thay bằng dòng dưới
        maven { url 'https://maven.google.com' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.3.3'
        classpath 'org.androidannotations:androidannotations:4.6.0'
    }
}

allprojects {
    repositories {
        // ❌ Xóa google() → thay bằng dòng dưới
        maven { url 'https://maven.google.com' }
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
