buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // ✅ AGP 4.1.3: CHẠY JDK 8, HỖ TRỢ ĐẾN ANDROID 14/16
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // ✅ CHỈ GỬ JITPACK NẾU CẦN (qrgen cũ / thư viện đặc biệt)
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
