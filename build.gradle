buildscript {
    repositories {
        // Dùng đường dẫn chính xác của Google Maven cho phiên bản cũ
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
    }
    dependencies {
        // Giữ nguyên phiên bản tương thích với dự án
        classpath 'com.android.tools.build:gradle:2.3.3'
        classpath 'org.androidannotations:androidannotations:4.6.0'
    }
}

allprojects {
    repositories {
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
