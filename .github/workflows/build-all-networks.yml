name: Build All Bitcoin Networks

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-mainnet:
    name: Build MAINNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # ✅ FIX CHÍNH Ở ĐÂY — GIẢI QUYẾT HẾT 2 LỖI TRƯỚC
      # 1. Thay jcenter() = mavenCentral + GOOGLE MAVEN CŨ + JCENTER MIRROR CÒN SỐNG
      # 2. Đổi AGP 2.3.1 -> 2.3.0 (bản này vẫn còn trên mirror)
      # ============================================================
      - name: FIX REPO + AGP VERSION (Gradle 3.3 compatible)
        run: |
          # 1. Thay jcenter() = đủ 3 repo còn sống cho thư viện cũ
          REPOS="mavenCentral()\n        maven { url 'https:\/\/dl.google.com\/dl\/android\/maven2\/' }\n        maven { url 'https:\/\/jcenter.bintray.com\/' }\n        maven { url 'https:\/\/plugins.gradle.org\/m2\/' }"
          find . -name "build.gradle" -type f | xargs sed -i "s/jcenter()/$REPOS/g"

          # 2. Đổi AGP 2.3.1 -> 2.3.0 (bản 2.3.1 đã bị xóa khỏi mọi server)
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'

          echo "✅ Fixed repos + AGP 2.3.1 -> 2.3.0 OK"
          cat build.gradle

      - name: Patch code to MAINNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/MainNetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "MainNetParams.get()" | while read f; do
            if ! grep -q "org.bitcoinj.params.MainNetParams" "$f"; then
              sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.MainNetParams;' "$f"
            fi
          done
          echo "Patched to MAINNET OK"

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 7302050
          packages: >
            build-tools;27.0.3
            platforms;android-27
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mainnet-gradle33-agp230-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            mainnet-gradle33-agp230-

      - name: Build MAINNET APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitcoinJ-Wallet-MAINNET.apk

      - name: Upload MAINNET APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-MAINNET
          path: app/build/outputs/apk/debug/BitcoinJ-Wallet-MAINNET.apk
          if-no-files-found: error
          retention-days: 90

  build-testnet:
    name: Build TESTNET3 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FIX REPO + AGP VERSION
        run: |
          REPOS="mavenCentral()\n        maven { url 'https:\/\/dl.google.com\/dl\/android\/maven2\/' }\n        maven { url 'https:\/\/jcenter.bintray.com\/' }\n        maven { url 'https:\/\/plugins.gradle.org\/m2\/' }"
          find . -name "build.gradle" -type f | xargs sed -i "s/jcenter()/$REPOS/g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          echo "✅ Fixed repos + AGP OK"

      - name: Keep TESTNET3 default
        run: echo "Use original TESTNET3 code"

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 7302050
          packages: >
            build-tools;27.0.3
            platforms;android-27
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: testnet-gradle33-agp230-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            testnet-gradle33-agp230-

      - name: Build TESTNET3 APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitcoinJ-Wallet-TESTNET3.apk

      - name: Upload TESTNET3 APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-TESTNET3
          path: app/build/outputs/apk/debug/BitcoinJ-Wallet-TESTNET3.apk
          if-no-files-found: error
          retention-days: 90

  build-signet:
    name: Build SIGNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FIX REPO + AGP VERSION
        run: |
          REPOS="mavenCentral()\n        maven { url 'https:\/\/dl.google.com\/dl\/android\/maven2\/' }\n        maven { url 'https:\/\/jcenter.bintray.com\/' }\n        maven { url 'https:\/\/plugins.gradle.org\/m2\/' }"
          find . -name "build.gradle" -type f | xargs sed -i "s/jcenter()/$REPOS/g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          echo "✅ Fixed repos + AGP OK"

      - name: Patch code to SIGNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/SignetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "SignetParams.get()" | while read f; do
            if ! grep -q "org.bitcoinj.params.SignetParams" "$f"; then
              sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.SignetParams;' "$f"
            fi
          done
          echo "Patched to SIGNET OK"

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 7302050
          packages: >
            build-tools;27.0.3
            platforms;android-27
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: signet-gradle33-agp230-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            signet-gradle33-agp230-

      - name: Build SIGNET APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitcoinJ-Wallet-SIGNET.apk

      - name: Upload SIGNET APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-SIGNET
          path: app/build/outputs/apk/debug/BitcoinJ-Wallet-SIGNET.apk
          if-no-files-found: error
          retention-days: 90

  zip-all:
    name: Zip All 3 APKs
    needs: [ build-mainnet, build-testnet, build-signet ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: APK-MAINNET }
      - uses: actions/download-artifact@v4
        with: { name: APK-TESTNET3 }
      - uses: actions/download-artifact@v4
        with: { name: APK-SIGNET }
      - run: zip -j BitcoinJ-Wallet-ALL-NETWORKS.zip *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZIP-ALL-3-APKS
          path: BitcoinJ-Wallet-ALL-NETWORKS.zip
          if-no-files-found: error
          retention-days: 90
