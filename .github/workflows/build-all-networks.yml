name: Build All Bitcoin Networks

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-mainnet:
    name: Build MAINNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Create gradle.properties + chmod
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxPermSize=1024m -Dfile.encoding=UTF-8
          android.sdk.channel=stable
          android.builder.sdkDownload=false
          EOF
          chmod +x gradlew

      - name: INSTALL SDK 26 + build-tools 26.0.2
        run: |
          rm -rf $ANDROID_HOME/platforms/android-3* $ANDROID_HOME/platforms/android-2[789] $ANDROID_HOME/platforms/android-25
          rm -rf $ANDROID_HOME/system-images/*
          rm -rf $ANDROID_HOME/build-tools/3* $ANDROID_HOME/build-tools/2[789]* $ANDROID_HOME/build-tools/25*
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" "tools" > /dev/null 2>&1 || true

      - name: FIX BUILDSCRIPT + REPO HẾT LỖI
        run: |
          find . -maxdepth 1 -name "build.gradle" -type f | xargs sed -i "s|jcenter()||g"
          find . -maxdepth 1 -name "build.gradle" -type f | xargs -i grep -q "repositories" {} || sed -i '/^buildscript {/a \
          repositories { google() mavenCentral() maven { url "https://repo1.maven.org/maven2" } maven { url "https://plugins.gradle.org/m2/" } }' {}
          find . -name "build.gradle" -type f | xargs sed -i "s|jcenter()||g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/com.journeyapps:zxing-android-embedded:3.0.2/com.journeyapps:zxing-android-embedded:3.0.1/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/compileSdkVersion 25/compileSdkVersion 26/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/compileSdkVersion 27/compileSdkVersion 26/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/buildToolsVersion ".*"/buildToolsVersion "26.0.2"/g'

      - name: PATCH MAINNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/MainNetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "MainNetParams.get()" | while read f; do
            grep -q "org.bitcoinj.params.MainNetParams" "$f" || sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.MainNetParams;' "$f"
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mainnet-sdk26-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            mainnet-sdk26-

      - name: BUILD APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: FIND APK
        id: findapk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && exit 1
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Rename & Upload
        run: mv "${{ steps.findapk.outputs.apk_path }}" BitcoinJ-Wallet-MAINNET.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-MAINNET
          path: BitcoinJ-Wallet-MAINNET.apk
          retention-days: 90

  build-testnet:
    name: Build TESTNET3 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'
      - run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxPermSize=1024m -Dfile.encoding=UTF-8
          android.sdk.channel=stable
          android.builder.sdkDownload=false
          EOF
          chmod +x gradlew
      - run: |
          rm -rf $ANDROID_HOME/platforms/android-3* $ANDROID_HOME/platforms/android-2[789] $ANDROID_HOME/platforms/android-25
          rm -rf $ANDROID_HOME/system-images/*
          rm -rf $ANDROID_HOME/build-tools/3* $ANDROID_HOME/build-tools/2[789]* $ANDROID_HOME/build-tools/25*
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" "tools" > /dev/null 2>&1 || true
      - run: |
          find . -maxdepth 1 -name "build.gradle" -type f | xargs sed -i "s|jcenter()||g"
          find . -name "build.gradle" -type f | xargs sed -i "s|jcenter()||g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/com.journeyapps:zxing-android-embedded:3.0.2/com.journeyapps:zxing-android-embedded:3.0.1/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/compileSdkVersion 25/compileSdkVersion 26/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/compileSdkVersion 27/compileSdkVersion 26/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/buildToolsVersion ".*"/buildToolsVersion "26.0.2"/g'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: testnet-sdk26-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            testnet-sdk26-
      - run: ./gradlew assembleDebug --stacktrace --no-daemon
      - id: findapk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && exit 1
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      - run: mv "${{ steps.findapk.outputs.apk_path }}" BitcoinJ-Wallet-TESTNET3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-TESTNET3
          path: BitcoinJ-Wallet-TESTNET3.apk
          retention-days: 90

  build-signet:
    name: Build SIGNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
