name: Build BitcoinJ Wallet
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Clear Gradle Cache
        run: rm -rf ~/.gradle/caches

      # ✅ CHỈ CÓ DÒNG NÀY — KHÔNG CÓ cmdline-tools-version NÀO CẢ
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;28.0.3"

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Tìm & Đổi tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - name: Tải APK
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
