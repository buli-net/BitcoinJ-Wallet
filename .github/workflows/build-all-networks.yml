name: Build All Bitcoin Networks

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-mainnet:
    name: Build MAINNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix jcenter to mavenCentral
        run: find . -name "build.gradle" -type f | xargs sed -i 's/jcenter()/mavenCentral()\n        google()/g'

      - name: Patch code to MAINNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/MainNetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "MainNetParams.get()" | while read f; do
            if ! grep -q "org.bitcoinj.params.MainNetParams" "$f"; then
              sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.MainNetParams;' "$f"
            fi
          done
          echo "Patched to MAINNET OK"

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 7302050
          packages: >
            build-tools;27.0.3
            platforms;android-27
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mainnet-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            mainnet-

      - name: Build MAINNET APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitcoinJ-Wallet-MAINNET.apk

      - name: Upload MAINNET APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-MAINNET
          path: app/build/outputs/apk/debug/BitcoinJ-Wallet-MAINNET.apk
          if-no-files-found: error
          retention-days: 90

  build-testnet:
    name: Build TESTNET3 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix jcenter to mavenCentral
        run: find . -name "build.gradle" -type f | xargs sed -i 's/jcenter()/mavenCentral()\n        google()/g'

      - name: Keep TESTNET3 default
        run: echo "Use original TESTNET3 code"

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 7302050
          packages: >
            build-tools;27.0.3
            platforms;android-27
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: testnet-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            testnet-

      - name: Build TESTNET3 APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitcoinJ-Wallet-TESTNET3.apk

      - name: Upload TESTNET3 APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-TESTNET3
          path: app/build/outputs/apk/debug/BitcoinJ-Wallet-TESTNET3.apk
          if-no-files-found: error
          retention-days: 90

  build-signet:
    name: Build SIGNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix jcenter to mavenCentral
        run: find . -name "build.gradle" -type f | xargs sed -i 's/jcenter()/mavenCentral()\n        google()/g'

      - name: Patch code to SIGNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/SignetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "SignetParams.get()" | while read f; do
            if ! grep -q "org.bitcoinj.params.SignetParams" "$f"; then
              sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.SignetParams;' "$f"
            fi
          done
          echo "Patched to SIGNET OK"

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 7302050
          packages: >
            build-tools;27.0.3
            platforms;android-27
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: signet-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            signet-

      - name: Build SIGNET APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BitcoinJ-Wallet-SIGNET.apk

      - name: Upload SIGNET APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-SIGNET
          path: app/build/outputs/apk/debug/BitcoinJ-Wallet-SIGNET.apk
          if-no-files-found: error
          retention-days: 90

  zip-all:
    name: Zip All 3 APKs
    needs: [ build-mainnet, build-testnet, build-signet ]
    runs-on: ubuntu-latest
    steps:
      - name: Download MAINNET
        uses: actions/download-artifact@v4
        with:
          name: APK-MAINNET
      - name: Download TESTNET3
        uses: actions/download-artifact@v4
        with:
          name: APK-TESTNET3
      - name: Download SIGNET
        uses: actions/download-artifact@v4
        with:
          name: APK-SIGNET

      - name: Create ZIP all
        run: zip -j BitcoinJ-Wallet-ALL-NETWORKS.zip *.apk

      - name: Upload ZIP ALL
        uses: actions/upload-artifact@v4
        with:
          name: ZIP-ALL-3-APKS
          path: BitcoinJ-Wallet-ALL-NETWORKS.zip
          if-no-files-found: error
          retention-days: 90
