name: Build BitcoinJ Wallet
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Xóa cache cũ
        run: rm -rf ~/.gradle/caches

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8092744
          accept-android-sdk-licenses: true
          packages: "platform-tools build-tools;28.0.3 platforms;android-28"

      # ✅ XÓA HẾT BUILD-TOOLS KHÁC → KHÔNG LỖI Not a number: 37.x
      - name: Giữ lại build-tools 28.0.3 duy nhất
        run: |
          cd $ANDROID_HOME/build-tools
          for dir in *; do
            [ "$dir" = "28.0.3" ] || rm -rf "$dir"
          done

      - name: chmod +x gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Đổi tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
