name: Build Bitcoin Wallet

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # ✅ THÊM: chống treo do thiếu RAM / daemon
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-20.04  # ✅ SỬA: latest → 20.04 (ổn định SDK cũ, không thiếu gói)
    timeout-minutes: 12     # ✅ THÊM: tự dừng nếu treo quá 12 phút
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 11 (bắt buộc cho bitcoinj 0.17.1)  # ✅ SỬA: 8 → 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'   # ✅ SỬA
          distribution: 'temurin'  # ✅ SỬA: zulu → temurin (ổn hơn trên Actions)
          cache: 'gradle'

      - name: Cấp quyền & Cài SDK đúng phiên bản
        run: |
          chmod +x gradlew
          # ✅ SỬA: bỏ yes| gây treo, chấp nhận license trước, 26.0.2 → 26.0.3 khớp AGP 3.6.4
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.3" "platforms;android-26" > /dev/null 2>&1 || true

      - name: Build theo cấu hình trong code
        # ✅ THÊM: --max-workers=2 chống treo do hết RAM trên runner
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Lưu APK
        run: mv app/build/outputs/apk/debug/app-debug.apk BitcoinJ-Wallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet.apk
          retention-days: 90
