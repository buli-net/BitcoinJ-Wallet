name: Build BitcoinJ Wallet
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  # ✅ Bỏ qua kiểm tra phiên bản JDK cho sdkmanager
  SKIP_JDK_VERSION_CHECK: "true"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      # ✅ XÓA CACHE + CLEAN DỰ ÁN
      - name: Clear Gradle Cache
        run: rm -rf ~/.gradle/caches

      # ✅ KHÔNG CÀI CMDLINE-TOOLS MỚI → DÙNG BẢN CÓ SẴN TƯƠNG THÍCH
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # KHÔNG ĐỊNH NGHĨA cmdline-tools-version → tự động dùng bản cũ tương thích JDK 8
          packages: "tools platform-tools build-tools;28.0.3"

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Tìm & Đổi tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - name: Tải APK về máy
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
