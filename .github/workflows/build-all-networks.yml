name: Build All Bitcoin Networks

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-mainnet:
    name: Build MAINNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'zulu', cache: 'gradle' }

      - name: Setup SDK & Quyền
        run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" > /dev/null 2>&1 || true

      - name: Chuyển sang MAINNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/MainNetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "MainNetParams.get()" | while read f; do
            grep -q "org.bitcoinj.params.MainNetParams" "$f" || sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.MainNetParams;' "$f"
          done

      - name: Build & Xuất APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          APK=$(find . -name "*debug*.apk" -type f | head -1)
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - uses: actions/upload-artifact@v4
        with: { name: APK-MAINNET, path: BitcoinJ-Wallet-MAINNET.apk, retention-days: 90 }

  build-testnet:
    name: Build TESTNET3 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'zulu', cache: 'gradle' }
      - run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" > /dev/null 2>&1 || true
      - run: ./gradlew assembleDebug --stacktrace --no-daemon
      - run: mv $(find . -name "*debug*.apk" -type f | head -1) BitcoinJ-Wallet-TESTNET3.apk
      - uses: actions/upload-artifact@v4
        with: { name: APK-TESTNET3, path: BitcoinJ-Wallet-TESTNET3.apk, retention-days: 90 }

  build-signet:
    name: Build SIGNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'zulu', cache: 'gradle' }
      - run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" > /dev/null 2>&1 || true
      - run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/SignetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "SignetParams.get()" | while read f; do
            grep -q "org.bitcoinj.params.SignetParams" "$f" || sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.SignetParams;' "$f"
          done
      - run: ./gradlew assembleDebug --stacktrace --no-daemon
      - run: mv $(find . -name "*debug*.apk" -type f | head -1) BitcoinJ-Wallet-SIGNET.apk
      - uses: actions/upload-artifact@v4
        with: { name: APK-SIGNET, path: BitcoinJ-Wallet-SIGNET.apk, retention-days: 90 }

  zip-all:
    name: Zip All 3 APKs
    needs: [ build-mainnet, build-testnet, build-signet ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: APK-MAINNET }
      - uses: actions/download-artifact@v4
        with: { name: APK-TESTNET3 }
      - uses: actions/download-artifact@v4
        with: { name: APK-SIGNET }
      - run: zip -j BitcoinJ-Wallet-ALL.zip *.apk
      - uses: actions/upload-artifact@v4
        with: { name: ZIP-ALL, path: BitcoinJ-Wallet-ALL.zip, retention-days: 90 }
