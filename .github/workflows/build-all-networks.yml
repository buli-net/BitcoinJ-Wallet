      - run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxPermSize=1024m -Dfile.encoding=UTF-8
          android.sdk.channel=stable
          android.builder.sdkDownload=false
          EOF
          chmod +x gradlew
      - run: |
          rm -rf $ANDROID_HOME/platforms/android-3* $ANDROID_HOME/platforms/android-2[789] $ANDROID_HOME/platforms/android-25
          rm -rf $ANDROID_HOME/system-images/*
          rm -rf $ANDROID_HOME/build-tools/3* $ANDROID_HOME/build-tools/2[789]* $ANDROID_HOME/build-tools/25*
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" "tools" > /dev/null 2>&1 || true
      - run: |
          find . -maxdepth 1 -name "build.gradle" -type f | xargs sed -i "s|jcenter()||g"
          find . -name "build.gradle" -type f | xargs sed -i "s|jcenter()||g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/com.journeyapps:zxing-android-embedded:3.0.2/com.journeyapps:zxing-android-embedded:3.0.1/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/compileSdkVersion 25/compileSdkVersion 26/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/compileSdkVersion 27/compileSdkVersion 26/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/buildToolsVersion ".*"/buildToolsVersion "26.0.2"/g'
      - run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/SignetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "SignetParams.get()" | while read f; do
            grep -q "org.bitcoinj.params.SignetParams" "$f" || sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.SignetParams;' "$f"
          done
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: signet-sdk26-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            signet-sdk26-
      - run: ./gradlew assembleDebug --stacktrace --no-daemon
      - id: findapk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && exit 1
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      - run: mv "${{ steps.findapk.outputs.apk_path }}" BitcoinJ-Wallet-SIGNET.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-SIGNET
          path: BitcoinJ-Wallet-SIGNET.apk
          retention-days: 90

  zip-all:
    name: Zip All 3 APKs
    needs: [ build-mainnet, build-testnet, build-signet ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: APK-MAINNET
      - uses: actions/download-artifact@v4
        with:
          name: APK-TESTNET3
      - uses: actions/download-artifact@v4
        with:
          name: APK-SIGNET
      - run: zip -j BitcoinJ-Wallet-ALL-NETWORKS.zip *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZIP-ALL-3-APKS
          path: BitcoinJ-Wallet-ALL-NETWORKS.zip
          retention-days: 90
