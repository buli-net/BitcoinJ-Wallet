name: Build Bitcoin Wallet

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 8 (bắt buộc cho dự án cũ)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Cấp quyền & Cài SDK đúng phiên bản
        run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;26.0.2" "platforms;android-26" > /dev/null 2>&1 || true

      - name: Build theo cấu hình trong code
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Lưu APK
        run: mv app/build/outputs/apk/debug/app-debug.apk BitcoinJ-Wallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet.apk
          retention-days: 90
