name: Build BitcoinJ Wallet APK

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MAINNET APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==== QUAN TRỌNG NHẤT: DÙNG JAVA 8 ====
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          APK=$(find . -name "*debug*.apk" -type f | head -1)
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
