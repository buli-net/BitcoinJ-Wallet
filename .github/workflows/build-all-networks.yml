name: Build BitcoinJ Wallet APK

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MAINNET APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==== JDK 8 - ĐÚNG CHO AGP 3.6.4 ====
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      # ==== KHÔNG CẦN DOWNLOAD CMDLINE-TOOLS MỚI ====
      # Máy ảnh đã có sẵn SDK + build-tools cũ tương thích
      - name: Cấp quyền & Cài đặt thiếu (nếu có)
        run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/tools/bin/sdkmanager "build-tools;26.0.3" "platforms;android-26"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Đổi tên file APK
        run: |
          APK=$(find . -name "*debug*.apk" -type f | head -1)
          mv "$APK" BitcoinJ-Wallet-MAINNET.apk

      - name: Tải APK về
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-APK
          path: BitcoinJ-Wallet-MAINNET.apk
