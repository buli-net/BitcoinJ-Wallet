name: Build All Bitcoin Networks

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-mainnet:
    name: Build MAINNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Create gradle.properties + chmod
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.sdk.channel=stable
          android.builder.sdkDownload=false
          EOF
          chmod +x gradlew

      - name: CLEAN SDK + INSTALL ANDROID 27
        run: |
          rm -rf $ANDROID_HOME/platforms/android-3* $ANDROID_HOME/platforms/android-2[89]
          rm -rf $ANDROID_HOME/system-images/*
          rm -rf $ANDROID_HOME/build-tools/3* $ANDROID_HOME/build-tools/2[89]*
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install \
            "platform-tools" "build-tools;27.0.3" "platforms;android-27" "tools" > /dev/null 2>&1 || true

      - name: FIX Repo + AGP + ZXing
        run: |
          REPOS="mavenCentral()\n        maven { url 'https:\/\/dl.google.com\/dl\/android\/maven2\/' }\n        maven { url 'https:\/\/jcenter.bintray.com\/' }\n        maven { url 'https:\/\/jitpack.io' }\n        maven { url 'https:\/\/plugins.gradle.org\/m2\/' }"
          find . -name "build.gradle" -type f | xargs sed -i "s/jcenter()/$REPOS/g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/com.journeyapps:zxing-android-embedded:3.0.2/com.journeyapps:zxing-android-embedded:3.0.1/g'

      - name: PATCH MAINNET
        run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/MainNetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "MainNetParams.get()" | while read f; do
            grep -q "org.bitcoinj.params.MainNetParams" "$f" || sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.MainNetParams;' "$f"
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mainnet-agp230-sdk27-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            mainnet-agp230-sdk27-

      - name: BUILD APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tail -100

      - name: TÌM ĐƯỜNG DẪN APK
        id: findapk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ KHÔNG TÌM THẤY APK → BUILD ĐÃ LỖI Ở TRÊN"
            exit 1
          fi
          echo "✅ TÌM THẤY APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Rename & Upload MAINNET
        run: mv "${{ steps.findapk.outputs.apk_path }}" BitcoinJ-Wallet-MAINNET.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-MAINNET
          path: BitcoinJ-Wallet-MAINNET.apk
          if-no-files-found: error
          retention-days: 90

  build-testnet:
    name: Build TESTNET3 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'
      - run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.sdk.channel=stable
          android.builder.sdkDownload=false
          EOF
          chmod +x gradlew
      - run: |
          rm -rf $ANDROID_HOME/platforms/android-3* $ANDROID_HOME/platforms/android-2[89] $ANDROID_HOME/system-images/*
          rm -rf $ANDROID_HOME/build-tools/3* $ANDROID_HOME/build-tools/2[89]*
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;27.0.3" "platforms;android-27" "tools" > /dev/null 2>&1 || true
      - run: |
          REPOS="mavenCentral()\n        maven { url 'https:\/\/dl.google.com\/dl\/android\/maven2\/' }\n        maven { url 'https:\/\/jcenter.bintray.com\/' }\n        maven { url 'https:\/\/jitpack.io' }\n        maven { url 'https:\/\/plugins.gradle.org\/m2\/' }"
          find . -name "build.gradle" -type f | xargs sed -i "s/jcenter()/$REPOS/g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/com.journeyapps:zxing-android-embedded:3.0.2/com.journeyapps:zxing-android-embedded:3.0.1/g'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: testnet-agp230-sdk27-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            testnet-agp230-sdk27-
      - name: BUILD APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tail -100
      - id: findapk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -type f 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && exit 1
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      - run: mv "${{ steps.findapk.outputs.apk_path }}" BitcoinJ-Wallet-TESTNET3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-TESTNET3
          path: BitcoinJ-Wallet-TESTNET3.apk
          if-no-files-found: error
          retention-days: 90

  build-signet:
    name: Build SIGNET APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'gradle'
      - run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.sdk.channel=stable
          android.builder.sdkDownload=false
          EOF
          chmod +x gradlew
      - run: |
          rm -rf $ANDROID_HOME/platforms/android-3* $ANDROID_HOME/platforms/android-2[89] $ANDROID_HOME/system-images/*
          rm -rf $ANDROID_HOME/build-tools/3* $ANDROID_HOME/build-tools/2[89]*
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "build-tools;27.0.3" "platforms;android-27" "tools" > /dev/null 2>&1 || true
      - run: |
          REPOS="mavenCentral()\n        maven { url 'https:\/\/dl.google.com\/dl\/android\/maven2\/' }\n        maven { url 'https:\/\/jcenter.bintray.com\/' }\n        maven { url 'https:\/\/jitpack.io' }\n        maven { url 'https:\/\/plugins.gradle.org\/m2\/' }"
          find . -name "build.gradle" -type f | xargs sed -i "s/jcenter()/$REPOS/g"
          find . -name "build.gradle" -type f | xargs sed -i 's/com.android.tools.build:gradle:2.3.1/com.android.tools.build:gradle:2.3.0/g'
          find . -name "build.gradle" -type f | xargs sed -i 's/com.journeyapps:zxing-android-embedded:3.0.2/com.journeyapps:zxing-android-embedded:3.0.1/g'
      - run: |
          find app/src -name "*.java" -type f | xargs sed -i 's/TestNet3Params.get()/SignetParams.get()/g'
          find app/src -name "*.java" -type f | xargs grep -l "SignetParams.get()" | while read f; do
            grep -q "org.bitcoinj.params.SignetParams" "$f" || sed -i '/import org.bitcoinj.params.TestNet3Params/a import org.bitcoinj.params.SignetParams;' "$f"
          done
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: signet-agp230-sdk27-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            signet-agp230-sdk27-
      - name: BUILD APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tail -100
      - id: findapk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -type f 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && exit 1
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      - run: mv "${{ steps.findapk.outputs.apk_path }}" BitcoinJ-Wallet-SIGNET.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-SIGNET
          path: BitcoinJ-Wallet-SIGNET.apk
          if-no-files-found: error
          retention-days: 90

  zip-all:
    name: Zip All 3 APKs
    needs: [ build-mainnet, build-testnet, build-signet ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: APK-MAINNET
      - uses: actions/download-artifact@v4
        with:
          name: APK-TESTNET3
      - uses: actions/download-artifact@v4
        with:
          name: APK-SIGNET
      - run: zip -j BitcoinJ-Wallet-ALL-NETWORKS.zip *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZIP-ALL-3-APKS
          path: BitcoinJ-Wallet-ALL-NETWORKS.zip
          if-no-files-found: error
          retention-days: 90
