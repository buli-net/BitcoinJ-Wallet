apply plugin: 'com.android.application'
apply plugin: 'me.tatarka.retrolambda'

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.2"

    defaultConfig {
        applicationId "com.example.thinkmobiles.bitcoinwalletsample"
        // ==== SỬA QUAN TRỌNG: bitcoinj yêu cầu tối thiểu API 24 ====
        minSdkVersion 24
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Giữ nguyên toàn bộ thư viện bạn có, chỉ sửa minSdk thôi
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:25.4.0'
    implementation 'com.android.support:design:25.4.0'
    implementation 'com.android.support:support-v4:25.4.0'
    implementation 'com.android.support:recyclerview-v7:25.4.0'
    implementation 'me.tatarka:gradle-retrolambda:3.6.0'
    // Giữ nguyên phiên bản bitcoinj bạn đang dùng
    implementation 'org.bitcoinj:bitcoinj-core:0.17'
}
