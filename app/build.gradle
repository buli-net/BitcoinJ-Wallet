apply plugin: 'com.android.application'
apply plugin: 'me.tatarka.retrolambda'

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.2"

    defaultConfig {
        applicationId "com.example.thinkmobiles.bitcoinwalletsample"
        minSdkVersion 24
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                includeCompileClasspath true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ==== LOẠI BỎ TOÀN BỘ LỚP TRÙNG LẶP ====
    packagingOptions {
        exclude 'META-INF/jsr305_annotations/**'
        exclude 'META-INF/jcip_annotations/**'
        exclude 'META-INF/annotations/**'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:25.4.0'
    implementation 'com.android.support:design:25.4.0'
    implementation 'com.android.support:support-v4:25.4.0'
    implementation 'com.android.support:recyclerview-v7:25.4.0'

    implementation 'me.tatarka:gradle-retrolambda:3.7.0'

    // AndroidAnnotations
    implementation 'org.androidannotations:androidannotations:4.6.0'
    annotationProcessor 'org.androidannotations:androidannotations:4.6.0'

    // Quét QR
    implementation 'com.journeyapps:zxing-android-embedded:3.5.0'
    implementation 'com.google.zxing:core:3.4.0'

    // Tạo QR
    implementation 'net.glxn.qrgen:android:2.0'

    // Bitcoinj + LOẠI BỎ THƯ VIỆN TRÙNG
    implementation ('org.bitcoinj:bitcoinj-core:0.17') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'net.jcip', module: 'jcip-annotations'
    }
}
