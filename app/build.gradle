apply plugin: 'com.android.application'
// ✅ TẮT RETROLAMBDA: minSdk 26 đã có D8 desugar sẵn, không cần nữa gây xung đột
// apply plugin: 'me.tatarka.retrolambda'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"
    defaultConfig {
        applicationId "com.example.thinkmobiles.bitcoinwalletsample"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                    androidManifestFile: "$projectDir/src/main/AndroidManifest.xml".toString()
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    exclude group: 'com.google.code.findbugs', module: 'jsr305'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
    exclude group: 'net.jcip', module: 'jcip-annotations'
    
    resolutionStrategy {
        // ✅ GUAVA 27.0.1-JRE: BẢN GỐC BITCOINJ 0.17.1 DÙNG — ĐẦY ĐỦ TẤT CẢ LỚP SERVICE
        force 'com.google.guava:guava:27.0.1-jre'
        force 'org.slf4j:slf4j-api:1.7.30'
        force 'com.google.protobuf:protobuf-java:3.11.4'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'

    annotationProcessor 'org.androidannotations:androidannotations:4.6.0'
    implementation 'org.androidannotations:androidannotations-api:4.6.0'

    implementation('com.journeyapps:zxing-android-embedded:3.5.0') {
        exclude group: 'com.google.code.findbugs'
        exclude group: 'net.jcip'
        exclude group: 'com.google.guava'
    }
    implementation 'com.google.zxing:core:3.4.0'
    implementation 'net.glxn.qrgen:android:2.0'

    implementation('org.bitcoinj:bitcoinj-core:0.17.1') {
        exclude group: 'com.google.code.findbugs'
        exclude group: 'net.jcip'
        exclude group: 'com.google.guava'
        exclude group: 'org.slf4j'
        exclude group: 'com.google.protobuf'
    }
    
    // ✅ GUAVA ĐẦY ĐỦ — CÓ AbstractIdleService, ServiceManager mà bitcoinj gọi
    implementation 'com.google.guava:guava:27.0.1-jre'
}
