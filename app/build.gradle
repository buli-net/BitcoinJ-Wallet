apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.example.thinkmobiles.bitcoinwalletsample"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        // ✅ DESUGAR ĐẦY ĐỦ JAVA 8 → CHẠY TỐT ANDROID 16
        coreLibraryDesugaringEnabled true

        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                    androidManifestFile: "$projectDir/src/main/AndroidManifest.xml".toString()
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    exclude group: 'com.google.code.findbugs', module: 'jsr305'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
    exclude group: 'net.jcip', module: 'jcip-annotations'

    resolutionStrategy {
        // ✅ GUAVA ANDROID CHÍNH THỨC: CÓ AbstractIdleService, KHÔNG CRASH
        force 'com.google.guava:guava:32.1.3-android'
        force 'org.slf4j:slf4j-api:1.7.36'
        force 'com.google.protobuf:protobuf-java:3.25.3'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // ✅ ANDROIDX (BẮT BUỘC SDK 34)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ✅ DESUGAR
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ✅ ANDROID ANNOTATIONS (CÓ TRÊN MAVENCENTRAL)
    annotationProcessor 'org.androidannotations:androidannotations:4.8.0'
    implementation 'org.androidannotations:androidannotations-api:4.8.0'

    // ✅ ZXING (MAVENCENTRAL)
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        exclude group: 'com.google.guava'
    }
    implementation 'com.google.zxing:core:3.5.2'

    // ✅ QR GEN (THAY BẢN CŨ QUA JITPACK, KHÔNG CẦN JCENTER)
    implementation 'com.github.kenglxn.QRGen:android:2.6.0'

    // ✅ BITCOINJ 0.17.1 (CÓ RÕ TRÊN MAVENCENTRAL)
    implementation('org.bitcoinj:bitcoinj-core:0.17.1') {
        exclude group: 'com.google.code.findbugs'
        exclude group: 'net.jcip'
        exclude group: 'com.google.guava'
        exclude group: 'org.slf4j'
        exclude group: 'com.google.protobuf'
    }

    // ✅ GUAVA ANDROID
    implementation 'com.google.guava:guava:32.1.3-android'

    // ✅ SLF4J ANDROID → KHÔNG CRASH THIẾU LOGGER
    implementation 'org.slf4j:slf4j-android:1.7.36'
}
