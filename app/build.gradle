apply plugin: 'com.android.application'
apply plugin: 'me.tatarka.retrolambda'

android {
    compileSdkVersion 25
    // ✅ Đổi sang phiên bản nguyên số, tương thích hoàn toàn
    buildToolsVersion "25.0.3"
    defaultConfig {
        applicationId "com.example.thinkmobiles.bitcoinwalletsample"
        minSdkVersion 15
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        // ✅ Cấu hình đúng AndroidAnnotations cho Gradle 2.3
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                    androidManifestFile: "$projectDir/src/main/AndroidManifest.xml".toString(),
                    resourcePackageName: "com.example.thinkmobiles.bitcoinwalletsample"
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ✅ Loại bỏ lớp trùng toàn cục
configurations {
    all {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'com.google.code.findbugs', module: 'annotations'
        exclude group: 'net.jcip', module: 'jcip-annotations'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:25.4.0'
    implementation 'com.android.support:design:25.4.0'
    implementation 'com.android.support:support-v4:25.4.0'
    implementation 'com.android.support:recyclerview-v7:25.4.0'

    implementation 'me.tatarka:gradle-retrolambda:3.6.0'

    // ✅ AndroidAnnotations chia đúng loại dependency
    provided 'org.androidannotations:androidannotations:4.6.0'
    annotationProcessor 'org.androidannotations:androidannotations:4.6.0'

    implementation('com.journeyapps:zxing-android-embedded:3.5.0') {
        exclude group: 'com.google.code.findbugs'
        exclude group: 'net.jcip'
    }
    implementation 'com.google.zxing:core:3.4.0'

    implementation 'net.glxn.qrgen:android:2.0'

    implementation('org.bitcoinj:bitcoinj-core:0.17') {
        exclude group: 'com.google.code.findbugs'
        exclude group: 'net.jcip'
    }
}
